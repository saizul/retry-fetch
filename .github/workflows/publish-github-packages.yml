name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@saizul'
      - run: npm ci
      - run: npm test
      # The package is already named @saizul/retry-fetch with
      # publishConfig.registry set to GitHub Packages; this check fails the
      # release early if either was changed by mistake.
      - name: Check the package name and registry
        run: |
          test "$(npm pkg get name)" = '"@saizul/retry-fetch"'
          test "$(npm pkg get publishConfig.registry)" = '"https://npm.pkg.github.com"'
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
